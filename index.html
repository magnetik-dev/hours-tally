<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Hours Tally</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
/* Layout: one narrow column — a live total panel on top, seven entry rows beneath, like a timesheet strip */
:root {
  --bg: #eef1f3;
  --surface: #ffffff;
  --fg: #16202a;
  --muted: #5d6b78;
  --line: #d5dce2;
  --accent: #0f7d74;
  --accent-soft: #dcefec;
  --warn: #b5541c;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1519; --surface: #172028; --fg: #e6ecf0; --muted: #94a3af;
    --line: #2a3640; --accent: #4cc3b6; --accent-soft: #163a37; --warn: #f0935a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1519; --surface: #172028; --fg: #e6ecf0; --muted: #94a3af;
  --line: #2a3640; --accent: #4cc3b6; --accent-soft: #163a37; --warn: #f0935a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--body); font-size: 15px; line-height: 1.5;
  padding-inline: 16px; padding-block: 32px 48px;
}
main { max-width: 560px; margin: 0 auto; display: grid; gap: 24px; }
header h1 {
  font-family: var(--display); font-weight: 700; font-size: 1.75rem;
  margin: 0; letter-spacing: -0.01em; text-wrap: balance;
}
header p { margin: 4px 0 0; color: var(--muted); }

.total {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 20px 22px; display: grid; gap: 6px;
}
.label {
  font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--muted); font-weight: 500;
}
.big {
  font-family: var(--mono); font-weight: 600; font-variant-numeric: tabular-nums;
  font-size: clamp(2.6rem, 11vw, 3.6rem); line-height: 1.05; color: var(--accent);
  transition: transform .15s ease;
}
.big.bump { transform: scale(1.03); }
.big small { font-size: 0.4em; color: var(--muted); font-weight: 500; margin-left: 4px; }
.sub { display: flex; flex-wrap: wrap; gap: 8px 18px; color: var(--muted); font-family: var(--mono); font-size: 0.9rem; font-variant-numeric: tabular-nums; }
.sub b { color: var(--fg); font-weight: 500; }

.rows { display: grid; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.row {
  display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 12px;
  align-items: center; padding: 10px 16px; border-top: 1px solid var(--line);
}
.row:first-child { border-top: 0; }
.row.filled { background: linear-gradient(90deg, var(--accent-soft), transparent 70%); }
.day { min-width: 0; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.day .short { display: none; }
.time { display: flex; align-items: center; gap: 6px; }
.field { display: flex; align-items: baseline; gap: 3px; }
.field input {
  width: 3.6rem; min-height: 44px; padding: 8px 6px; text-align: right;
  font-family: var(--mono); font-size: 16px; font-variant-numeric: tabular-nums;
  color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  -moz-appearance: textfield;
}
.field input::-webkit-outer-spin-button, .field input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.field input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
.field input[aria-invalid="true"] { border-color: var(--warn); color: var(--warn); }
.field span { font-size: 0.8rem; color: var(--muted); font-family: var(--mono); }
.colon { color: var(--muted); }

.foot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }
.note { color: var(--muted); font-size: 0.85rem; margin: 0; min-width: 0; }
.note.warn { color: var(--warn); }
button {
  font: inherit; font-weight: 500; cursor: pointer; padding: 9px 16px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg);
}
button:hover { border-color: var(--accent); color: var(--accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

@media (max-width: 420px) {
  body { padding-block: 20px 32px; }
  main { gap: 16px; }
  header h1 { font-size: 1.5rem; }
  .total { padding: 16px 18px; }
  .row { padding: 8px 12px; gap: 8px; }
  .day .full { display: none; }
  .day .short { display: inline; }
  .field input { width: 3.3rem; }
  .foot { flex-direction: column; align-items: stretch; }
  .foot button { min-height: 44px; }
}
@media (prefers-reduced-motion: reduce) { .big { transition: none; } }
</style>

<main>
  <header>
    <h1>Hours Tally</h1>
  </header>

  <section class="total" aria-live="polite">
    <span class="label">Running total</span>
    <div class="big" id="total">0:00<small>h</small></div>
    <div class="sub">
      <span><b id="decimal">0.00</b> decimal hours</span>
      <span><b id="mins">0</b> minutes</span>
      <span><b id="count">0</b> of 7 entries</span>
    </div>
  </section>

  <section class="rows" id="rows" aria-label="Time entries"></section>

  <div class="foot">
    <p class="note" id="note">Minutes over 59 roll into hours automatically.</p>
    <button type="button" id="clear">Clear all</button>
  </div>
</main>

<script>
(function () {
  const N = 7;
  const days = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
  const KEY = "hours-tally-v1";
  const rowsEl = document.getElementById("rows");
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) {}

  for (let i = 0; i < N; i++) {
    const s = (saved && saved[i]) || {};
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML =
      '<span class="day"><span class="full">' + days[i] + '</span><span class="short" aria-hidden="true">' + days[i].slice(0, 3) + '</span></span>' +
      '<div class="time">' +
        '<label class="field"><input id="h' + i + '" type="number" inputmode="numeric" min="0" step="1" placeholder="0" aria-label="' + days[i] + ' hours"><span>h</span></label>' +
        '<span class="colon">:</span>' +
        '<label class="field"><input id="m' + i + '" type="number" inputmode="numeric" min="0" step="1" placeholder="00" aria-label="' + days[i] + ' minutes"><span>m</span></label>' +
      '</div>';
    rowsEl.appendChild(row);
    row.querySelector("#h" + i).value = s.h ?? "";
    row.querySelector("#m" + i).value = s.m ?? "";
  }

  const totalEl = document.getElementById("total");
  const noteEl = document.getElementById("note");
  let last = -1;

  function read(el) {
    const v = el.value.trim();
    if (v === "") return { val: 0, ok: true, empty: true };
    const n = Number(v);
    const ok = Number.isFinite(n) && n >= 0 && Number.isInteger(n);
    return { val: ok ? n : 0, ok, empty: false };
  }

  function update() {
    let minutes = 0, count = 0, bad = false;
    const store = [];
    for (let i = 0; i < N; i++) {
      const hEl = document.getElementById("h" + i), mEl = document.getElementById("m" + i);
      const h = read(hEl), m = read(mEl);
      hEl.setAttribute("aria-invalid", String(!h.ok));
      mEl.setAttribute("aria-invalid", String(!m.ok));
      if (!h.ok || !m.ok) bad = true;
      const rowMin = h.val * 60 + m.val;
      minutes += rowMin;
      if (rowMin > 0) count++;
      hEl.closest(".row").classList.toggle("filled", rowMin > 0);
      store.push({ h: hEl.value, m: mEl.value });
    }
    const hh = Math.floor(minutes / 60), mm = minutes % 60;
    totalEl.innerHTML = hh + ":" + String(mm).padStart(2, "0") + "<small>h</small>";
    document.getElementById("decimal").textContent = (minutes / 60).toFixed(2);
    document.getElementById("mins").textContent = minutes.toLocaleString();
    document.getElementById("count").textContent = count;
    noteEl.textContent = bad
      ? "Use whole, positive numbers. Highlighted fields aren't counted."
      : "Minutes over 59 roll into hours automatically.";
    noteEl.classList.toggle("warn", bad);
    if (minutes !== last && last !== -1) {
      totalEl.classList.add("bump");
      setTimeout(() => totalEl.classList.remove("bump"), 150);
    }
    last = minutes;
    try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {}
  }

  rowsEl.addEventListener("input", update);
  document.getElementById("clear").addEventListener("click", () => {
    rowsEl.querySelectorAll("input").forEach(el => (el.value = ""));
    update();
    document.getElementById("h0").focus();
  });
  update();
})();
</script>

</body></html>
